name: CI — qualité de simulation
on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.49.1-noble   # Chromium et Node déjà installés
    permissions: { contents: read, issues: write }
    steps:
      - uses: actions/checkout@v4
      - name: Syntaxe
        run: npm run check
      - name: Lint statique du contenu (textes vs gardes, cliquet)
        run: npm run static
      - name: Linter de récits (300 vies, 30 règles de cohérence)
        run: npm run lint
      - name: Calibrage statistique (800 vies)
        run: npm run calib
      - name: Dépendances
        timeout-minutes: 5
        run: npm install --no-audit --no-fund
      - name: Test navigateur
        timeout-minutes: 6
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set +e; timeout 300 npm run smoke > smoke.log 2>&1; RC=$?; cat smoke.log
          if [ $RC -ne 0 ]; then { echo '```'; tail -c 6000 smoke.log; echo '```'; } > body.md; gh api "repos/${GITHUB_REPOSITORY}/issues" -f title="CI : test navigateur en échec ($(git rev-parse --short HEAD))" -F body=@body.md -f 'labels[]=ci' >/dev/null || true; fi
          exit $RC
  promote:
    # dev → main seulement si tout passe ; GitHub Pages déploie main
    needs: test
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Avancer main sur dev
        run: |
          git config user.name "nelabas-ci"
          git config user.email "ci@nelabas"
          git push origin HEAD:main
